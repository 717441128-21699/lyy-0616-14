<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC SFU 多人视频通话</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e0e0e0;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    header {
      text-align: center;
      padding: 20px 0 30px;
    }
    header h1 {
      font-size: 28px;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    header p { color: #8892b0; font-size: 14px; }
    .panel {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    .login-panel {
      max-width: 500px;
      margin: 60px auto;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #a8b2d1;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus {
      border-color: #4facfe;
    }
    .mode-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }
    .mode-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255,255,255,0.06);
      border: 2px solid transparent;
      border-radius: 8px;
      color: #a8b2d1;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .mode-btn.active {
      border-color: #4facfe;
      background: rgba(79,172,254,0.1);
      color: #fff;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
      border: none;
      border-radius: 8px;
      color: #0a0a1a;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn:hover { transform: translateY(-1px); opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger {
      background: linear-gradient(90deg, #f5576c 0%, #f093fb 100%);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: #e0e0e0;
    }
    .room-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .room-info {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(79,172,254,0.15);
      border: 1px solid rgba(79,172,254,0.3);
      border-radius: 20px;
      font-size: 12px;
      color: #4facfe;
    }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .video-card {
      position: relative;
      background: #0a0a1a;
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .video-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 6px;
      font-size: 13px;
      backdrop-filter: blur(4px);
    }
    .video-label.local {
      background: rgba(79,172,254,0.8);
    }
    .video-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 6px;
    }
    .indicator-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    .indicator-dot.muted {
      background: rgba(245,87,108,0.8);
    }
    .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e, #0f3460);
    }
    .placeholder .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      color: #0a0a1a;
      margin-bottom: 10px;
    }
    .status-panel {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }
    .status-item {
      padding: 12px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      border-left: 3px solid #4facfe;
    }
    .status-item .label {
      font-size: 12px;
      color: #8892b0;
      margin-bottom: 4px;
    }
    .status-item .value {
      font-size: 16px;
      font-weight: 600;
      color: #e0e0e0;
    }
    .log-panel {
      max-height: 200px;
      overflow-y: auto;
      font-family: 'Consolas', monospace;
      font-size: 12px;
    }
    .log-entry {
      padding: 4px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: #a8b2d1;
    }
    .log-entry.info { color: #4facfe; }
    .log-entry.success { color: #36d399; }
    .log-entry.warn { color: #fbbf24; }
    .log-entry.error { color: #f5576c; }
    .log-time { color: #666; margin-right: 8px; }
    .participants-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .participant-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
    }
    .participant-info { display: flex; align-items: center; gap: 10px; }
    .participant-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(90deg, #4facfe, #00f2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
      color: #0a0a1a;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #36d399;
    }
    .hidden { display: none !important; }
    .chat-panel {
      max-height: 300px;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      margin-bottom: 10px;
      min-height: 150px;
    }
    .chat-msg {
      padding: 6px 10px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 6px;
      font-size: 13px;
    }
    .chat-msg .sender {
      font-weight: 600;
      color: #4facfe;
      margin-right: 6px;
    }
    .chat-input-row {
      display: flex;
      gap: 8px;
    }
    .chat-input-row input {
      flex: 1;
      padding: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #e0e0e0;
      outline: none;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    @media (max-width: 900px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>WebRTC SFU 多人视频通话</h1>
      <p>支持 Mesh 网状直连 与 SFU 媒体转发两种模式</p>
    </header>

    <div id="loginSection" class="panel login-panel">
      <h2 style="margin-bottom:20px; color:#ccd6f6;">加入房间</h2>

      <div class="form-group">
        <label>连接模式</label>
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="sfu">
            <div style="font-weight:600; margin-bottom:4px;">SFU 模式</div>
            <div style="font-size:11px; opacity:0.7;">通过服务器转发，适合多人</div>
          </button>
          <button class="mode-btn" data-mode="mesh">
            <div style="font-weight:600; margin-bottom:4px;">Mesh 模式</div>
            <div style="font-size:11px; opacity:0.7;">两两直连，适合2-3人</div>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>房间号</label>
        <input type="text" id="roomIdInput" value="demo-room-001" placeholder="输入房间号">
      </div>

      <div class="form-group">
        <label>昵称</label>
        <input type="text" id="nameInput" value="" placeholder="输入你的昵称">
      </div>

      <button class="btn" id="joinBtn" style="width:100%;" onclick="joinRoom()">加入房间</button>
    </div>

    <div id="roomSection" class="hidden">
      <div class="panel">
        <div class="room-header">
          <div class="room-info">
            <span class="badge">房间: <span id="currentRoom"></span></span>
            <span class="badge">模式: <span id="currentMode"></span></span>
            <span class="badge">ID: <span id="myClientId"></span></span>
          </div>
          <div class="controls">
            <button class="btn btn-secondary" id="micBtn" onclick="toggleMic()">🎤 静音</button>
            <button class="btn btn-secondary" id="camBtn" onclick="toggleCam()">📷 关摄像头</button>
            <button class="btn-secondary btn" onclick="switchCamera()">🔄 切换摄像头</button>
            <button class="btn btn-danger" onclick="leaveRoom()">退出房间</button>
          </div>
        </div>
      </div>

      <div class="grid-2">
        <div>
          <div class="panel">
            <h3 style="margin-bottom:16px; color:#ccd6f6;">视频画面</h3>
            <div class="video-grid" id="videoGrid"></div>
          </div>

          <div class="panel">
            <h3 style="margin-bottom:16px; color:#ccd6f6;">房间状态</h3>
            <div class="status-panel" id="statusPanel"></div>
          </div>

          <div class="panel">
            <h3 style="margin-bottom:16px; color:#ccd6f6;">信令日志</h3>
            <div class="log-panel" id="logPanel"></div>
          </div>
        </div>

        <div>
          <div class="panel">
            <h3 style="margin-bottom:16px; color:#ccd6f6;">参与者 ( <span id="participantCount">1</span> )</h3>
            <div class="participants-list" id="participantsList"></div>
          </div>

          <div class="panel chat-panel">
            <h3 style="margin-bottom:16px; color:#ccd6f6;">文字聊天</h3>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-row">
              <input type="text" id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')sendChat()">
              <button class="btn" onclick="sendChat()">发送</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
